<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.5; }
        .button {
            display: inline-block;
            padding: 12px 18px;
            background: #2563eb;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<h2>Verify your email</h2>
<p th:text="'Hello ' + ${displayName} + ','"></p>
<p>Thanks for creating an account. Please verify your email address to activate your account.</p>
<p>
    <a th:href="${verificationLink}" class="button">Verify Email</a>
</p>
<p>If the button does not work, copy and paste this link into your browser:</p>
<p><a th:href="${verificationLink}" th:text="${verificationLink}"></a></p>
</body>
</html>
